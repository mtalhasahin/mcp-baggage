name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The transport tests spawn processes and the Windows path through the
    # shell is the one that breaks, so it is not left untested.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
